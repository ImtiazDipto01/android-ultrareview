name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test installer and package
        run: npm test

      - name: Verify package contents
        run: npm run pack:check

      - name: Materialize pinned benchmark repositories
        run: python3 scripts/materialize_benchmarks.py --output .tmp/benchmarks
