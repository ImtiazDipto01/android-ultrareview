name: Feature request
description: Propose a portable review or tooling improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Review problem
      description: What concrete failure, ambiguity, or repeated work should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: portability
    attributes:
      label: Portability and scoring impact
      description: Explain affected agents, Android projects, score gates, and re-review continuity.
  - type: textarea
    id: evidence
    attributes:
      label: Examples or primary sources
