name: Bug report
description: Report incorrect installer or review-skill behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for making Android UltraReview more reliable. Do not include private repository code or credentials.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Agent host
      options:
        - Codex
        - Claude Code
        - Cursor
        - Other Agent Skills host
        - Not agent-specific
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal, sanitized prompt, target shape, command, or fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include sanitized output, score/decision mismatch, or installer error.
